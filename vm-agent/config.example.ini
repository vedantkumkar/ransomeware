; RansomGuard IR VM detection agent configuration.
; Copy this file to config.ini (config.ini is gitignored) and edit as needed.
; Every value can also be overridden with a VM_AGENT_* environment variable,
; e.g. VM_AGENT_BACKEND_URL, VM_AGENT_HOSTNAME, VM_AGENT_TEST_DIR (see README.md).

[backend]
; FastAPI backend base URL. The default is the VirtualBox host-only gateway
; as seen from inside the VM; for host-side testing use http://localhost:8000
url = http://192.168.56.1:8000

[monitor]
; SAFETY: the agent refuses to start unless this resolves (case-insensitively)
; to exactly C:\RansomwareDemo\TestFiles. The ONLY way to monitor a different
; directory is the VM_AGENT_TEST_DIR environment variable (temp dirs only).
dir = C:\RansomwareDemo\TestFiles
; Seconds between directory snapshots.
scan_interval_seconds = 1.0

[detection]
; rapid_file_modification fires when MORE than rapid_change_threshold file
; create/modify events are observed within rapid_window_seconds (sliding
; window accumulated across scans).
rapid_change_threshold = 10
rapid_window_seconds = 10.0
; locked_extension_activity fires when MORE than this many '.locked' files exist.
locked_files_threshold = 5
; Minimum seconds between detection reports sent to the backend.
cooldown_seconds = 60
; Burst aggregation: once a threshold is crossed, the agent waits for the
; directory to be quiet for this many consecutive scans before reporting, so
; the whole behavior burst (modification + .locked copies + note) is
; aggregated into ONE event.
burst_quiet_scans = 2
; Safety valve: a burst older than this many seconds is reported even if
; activity never stops (endless-drip behavior).
max_burst_seconds = 30.0

[identity]
; Demo identity values (must match shared/CONTRACTS.md section 5).
hostname = VICTIM-PC-01
ip_address = 192.168.56.105
username = demo-user
process_name = DemoRansomware.exe
; tasklist cannot report full image paths, so the detection event reports
; this configured path when the process is found.
process_path = C:\RansomwareDemo\DemoRansomware.exe
